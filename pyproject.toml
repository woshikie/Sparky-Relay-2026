[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
# Only the app. The check_*.py scripts need a browser or a live site; they run
# inside the image instead, and counting them would flatter the number.
source = ["."]
omit = [
    "tests/*",
    "check_*.py",
    "relay/site/driver.py",
    # __main__ is the eight-line entrypoint: the config guard plus a main()
    # call. Coverage cannot see it because it only runs in a subprocess, and
    # test_config proves it that way instead (`python -m relay`, exit 2, the
    # message, no traceback).
    "relay/__main__.py",
    "*/.venv/*",
    "setup.sh",
    "*/__pycache__/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# relay_site.py drives a real browser and is verified end to end by
# check_container.py inside the image, not here, so it is omitted above.
#
# The floor is 90, not 100. The gap is browser code in bot.py: the success
# path of on_photo, the commit itself in cb_ok, and the app construction in
# main(). Those need a live Firefox and a real Telegram API, and they are
# covered by make verify inside the image. Chasing the last few percent here
# would mean either a fake browser that proves nothing or excluding the lines
# and calling it a pass.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
# The container runs 3.12 while the dev machine runs 3.14: rules that suggest
# newer syntax must stay quiet, or the linter will talk us into code the
# deployment cannot run.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (includes E501 line length)
    "F",   # pyflakes: unused imports and names -- the split left several
    "I",   # isort: one import order, no debates
    "W",
    "UP",  # pyupgrade, capped at 3.12 by target-version above
    "B",   # bugbear: the likely-bugs class (B904 raise-from, B008, ...)
    "C4",  # comprehensions: no pointless list()/dict() calls
    "SIM", # simplify: collapsible ifs,slow except-pass patterns
    "RUF", # ruff-specific, including RUF100 unused-noqa
    "ANN", # annotations must be present (correctness is mypy's job)
    "D",   # docstring hygiene; the write-prose rules are off below
]
ignore = [
    # The codebase formats with % throughout, consistently. Converting 120
    # sites to f-strings is churn with zero hardening value; % stays.
    "UP031",
    # Docstring *existence* is not mandated: D103/D102 would demand ~90 new
    # docstrings (many on one-line helpers, where they are noise) and D401
    # would rewrite 25 existing ones into imperative mood. What is enforced
    # is hygiene on the documentation already written: blank lines,
    # capitalization, section format.
    "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D401",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles are scaffolding: the tests pin behavior, not types. Annotating
# forty fakes adds noise, not safety.
"tests/*" = ["ANN"]

[tool.mypy]
# Correctness gate to ruff/ANN's presence gate: ANN demands the annotations
# exist, mypy demands they check out. Default settings, deliberately not
# strict -- strict's extras (disallow_any_generics, warn_return_any) mostly
# punish the selenium/sqlite boundary, where Any is honest.
python_version = "3.12"
