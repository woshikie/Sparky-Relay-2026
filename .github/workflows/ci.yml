name: relay

# PRs (and master pushes) get the static gate. The container only builds
# on the `release` branch, where a green build pushes multi-arch to GHCR.
on:
  pull_request:
  push:
    branches: [master, release]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check relay/ check_container.py check_lifecycle.py

      - name: Format check (ruff)
        run: python -m ruff format --check relay/ check_container.py check_lifecycle.py

      - name: Types (mypy, Python 3.12 target)
        run: python -m mypy relay/ check_container.py check_lifecycle.py

      - name: Tests with coverage (floor 90, from pyproject.toml)
        run: python -m pytest tests/ --cov=. --cov-report=term-missing

  build:
    needs: check
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One manifest, two architectures. amd64 is the Oracle target; arm64
      # covers Macs and ARM VMs. Emulated arm64 is I/O-bound here (apk +
      # wheels, no compilation), so QEMU stays practical; if the build
      # ever exceeds ~30min, split to native ubuntu-24.04-arm runners
      # and merge manifests with `buildx imagetools create` instead.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/woshikie/sparky-relay-2026:release
            ghcr.io/woshikie/sparky-relay-2026:${{ github.sha }}
